name: Build iOS IPA (unsigned, for sideloading)

# "Bot" that builds a sideloadable LibreScore IPA from the Flutter source.
# Trigger manually from the Actions tab, or automatically on version tags.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Ensure iOS platform files exist
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org org.librescore .
          fi

      - name: Build unsigned iOS app
        run: |
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # Drop any code signature leftovers so sideloaders can re-sign cleanly
          rm -rf Payload/Runner.app/_CodeSignature || true
          zip -r LibreScore-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreScore-ipa
          path: LibreScore-unsigned.ipa
          retention-days: 30
